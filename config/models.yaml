# LLM Model Configuration
llm:
  provider: google  # google, openai, anthropic
  model: gemini-2.5-flash
  
  # Generation parameters
  temperature: 0.7
  max_tokens: 8192
  top_p: 0.95
  top_k: 40
  
  # API configuration
  timeout: 30
  max_retries: 3
  retry_delay: 1.0
  
  # Rate limiting
  requests_per_minute: 60
  tokens_per_minute: 100000
  
  # Caching
  enable_cache: true
  cache_ttl: 3600

# Alternative models configuration
models:
  fast:
    model: gemini-2.5-flash
    temperature: 0.7
    max_tokens: 4096
    
  balanced:
    model: gemini-2.5-flash
    temperature: 0.7
    max_tokens: 8192
    
  creative:
    model: gemini-2.5-flash
    temperature: 0.9
    max_tokens: 8192
    
  precise:
    model: gemini-2.5-flash
    temperature: 0.3
    max_tokens: 8192

# Embedding model configuration
embeddings:
  provider: sentence-transformers
  model: all-MiniLM-L6-v2
  dimension: 384
  batch_size: 32
