# Safety and Alignment Configuration

# Content alignment
alignment:
  check_enabled: true
  strictness: medium  # low, medium, high, maximum
  
  # Pre-generation checks
  pre_check:
    enabled: true
    block_on_failure: true
    
  # Post-generation checks
  post_check:
    enabled: true
    flag_on_failure: true
    auto_filter: false
  
  # Alignment dimensions
  dimensions:
    helpfulness: 0.3
    harmlessness: 0.4
    honesty: 0.3
  
  # User preference alignment
  user_preferences:
    learn_from_feedback: true
    adaptation_rate: 0.1
    min_samples: 10

# Policy engine
policy:
  enforcement_level: strict  # permissive, moderate, strict
  
  # Blocked content categories
  blocked_topics:
    - harmful_content
    - privacy_violation
    - illegal_activities
    - misinformation
    - hate_speech
    - violence
    - adult_content
    - self_harm
  
  # Allowed with caution
  cautious_topics:
    - sensitive_personal_data
    - political_content
    - medical_advice
    - financial_advice
    - legal_advice
  
  # Content filtering
  content_filter:
    enabled: true
    pii_detection: true
    profanity_filter: false
    toxic_content_threshold: 0.7
  
  # Creative compliance
  creative_compliance:
    enabled: true
    reframe_unsafe_requests: true
    suggest_alternatives: true
    education_mode: true

# Audit and logging
audit:
  enabled: true
  log_level: info  # debug, info, warning, error
  retention_days: 90
  
  # Data privacy
  anonymize_data: true
  anonymize_user_id: true
  anonymize_prompts: false
  
  # Logged events
  events:
    - optimization_request
    - safety_violation
    - policy_enforcement
    - user_feedback
    - system_errors
    - performance_metrics
  
  # Storage
  storage:
    backend: file  # file, database, cloud
    path: logs/audit
    rotation: daily
    max_size_mb: 100
    compression: true
  
  # Reporting
  reporting:
    enabled: true
    frequency: weekly
    include_statistics: true
    alert_on_violations: true

# Red teaming and adversarial testing
red_team:
  enabled: false  # Enable for security testing
  
  # Attack detection
  attack_detection:
    prompt_injection: true
    jailbreak_attempts: true
    data_extraction: true
    
  # Response strategies
  response:
    log_attempts: true
    increase_scrutiny: true
    temporary_block: false
    block_duration_minutes: 60

# Bias detection and mitigation
bias:
  detection_enabled: true
  
  # Bias categories to monitor
  categories:
    - gender
    - race
    - age
    - religion
    - nationality
    - socioeconomic
  
  # Mitigation strategies
  mitigation:
    enabled: true
    balanced_perspective: true
    diverse_examples: true
    explicit_disclaimers: true

# Transparency and explainability
transparency:
  enabled: true
  
  # Decision explanations
  explain_decisions:
    safety_blocks: true
    policy_enforcement: true
    optimization_choices: true
  
  # User notifications
  notifications:
    safety_concerns: true
    content_modifications: true
    data_usage: true
  
  # Audit trail access
  user_access:
    view_own_logs: true
    export_data: true
    deletion_requests: true

# Compliance
compliance:
  # Regulatory frameworks
  frameworks:
    gdpr: true
    ccpa: true
    coppa: false
    
  # Data handling
  data_handling:
    minimize_collection: true
    purpose_limitation: true
    storage_limitation: true
    
  # User rights
  user_rights:
    access: true
    rectification: true
    erasure: true
    portability: true
    objection: true

# Emergency controls
emergency:
  kill_switch: false
  
  # Emergency actions
  actions:
    stop_all_optimization: false
    reject_all_requests: false
    alert_administrators: true
    
  # Recovery
  recovery_mode:
    enabled: false
    safe_mode_only: false
