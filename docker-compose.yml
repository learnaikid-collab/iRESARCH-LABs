version: '3.8'

services:
  apos-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apos-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - apos-network

  # Optional: Redis for caching (future enhancement)
  # redis:
  #   image: redis:7-alpine
  #   container_name: apos-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   restart: unless-stopped
  #   networks:
  #     - apos-network

  # Optional: PostgreSQL for production database (future enhancement)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: apos-postgres
  #   environment:
  #     POSTGRES_DB: apos
  #     POSTGRES_USER: apos
  #     POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   networks:
  #     - apos-network

networks:
  apos-network:
    driver: bridge

volumes:
  # redis-data:
